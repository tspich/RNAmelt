[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rnamelt"
version = "0.2.0"
description = "Two-state thermodynamic analysis (ΔH, ΔS, ΔG, Tm) of RNA melting curves"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "tspich" },
    { name = "RaumZeit" },
]
keywords = ["rna", "melting curve", "thermodynamics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/tspich/RNAmelt"
Issues = "https://github.com/tspich/RNAmelt/issues"

[tool.hatch.build.targets.wheel]
packages = ["rnamelt"]
# Local backup and experimental detectors: kept in the repository for the
# scripts, not shipped.
exclude = [
    "rnamelt/old_api.py",
    "rnamelt/auto_baseline_tests.py",
]

[tool.hatch.build.targets.sdist]
include = [
    "rnamelt",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "rnamelt/old_api.py",
    "rnamelt/auto_baseline_tests.py",
]
